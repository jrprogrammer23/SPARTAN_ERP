<style>

    .timeline-card-item::before { content: ''; position: absolute; left: -27px; top: 10px; width: 12px; height: 12px; border-radius: 50%; background: var(--card); border: 3px solid var(--brand); z-index: 2; }

    .view-section { display: none; animation: fadeIn 0.35s ease-out; }

    .photo-box { width: 100%; height: 220px; border-radius: var(--radius); border: 2px dashed var(--border); display: flex; align-items: center; justify-content: center; overflow: hidden; background: var(--bg); cursor: pointer; position: relative; }

    .overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.4); z-index: 1000; display: none; }

    .calendar-grid .day-cell { background: var(--card); min-height: 90px; padding: 6px; cursor: pointer; transition: var(--transition); display: flex; flex-direction: column; }
    .calendar-grid .day-cell:hover { background: rgba(14, 165, 233, 0.05); }

    .calendar-grid .day-cell .day-number { font-weight: 700; font-size: .85rem; color: var(--text-main); margin-bottom: 6px; display: inline-flex; width: 22px; height: 22px; align-items: center; justify-content: center; border-radius: 50%; }
    .calendar-grid .day-cell.bg-light .day-number { background: var(--brand); color: white; box-shadow: 0 2px 4px rgba(14, 165, 233, 0.3); }
    .calendar-grid .day-cell .event-item { font-size: .65rem; padding: 3px 6px; border-radius: 6px; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; cursor: pointer; transition: var(--transition); }

    .event-prioridad-alta { background: rgba(239, 68, 68, 0.1) !important; color: #ef4444 !important; border-left: 3px solid #ef4444 !important; }
    .event-prioridad-media { background: rgba(245, 158, 11, 0.1) !important; color: #f59e0b !important; border-left: 3px solid #f59e0b !important; }
    .event-prioridad-baja { background: rgba(34, 197, 94, 0.1) !important; color: #22c55e !important; border-left: 3px solid #22c55e !important; }
    .event-prioridad-default { background: rgba(14, 165, 233, 0.1) !important; color: var(--brand) !important; border-left: 3px solid var(--brand) !important; }
    .event-completado { text-decoration: line-through; opacity: .6; }

    @media (max-width: 991.98px) {
        .calendar-grid { grid-template-rows: 35px repeat(6, 60px) !important; }
        .calendar-grid .day-cell { min-height: 60px !important; height: 60px !important; padding: 4px !important; justify-content: flex-start; align-items: center; overflow: hidden !important; }
        .calendar-grid .day-cell .day-number { margin-bottom: 2px; font-size: 0.8rem; }
    }
</style>
